# Whipspot's lunepack configuration: public keys and signer locations only, never a key.
# Read by the lunepack CLI (`pack`, `setup` and `publish ...`) in .github/workflows/release.yml
# and refresh.yml; operator steps in release/README.md.
#
# The app id, the root key and the feed below are compiled into every installed copy's
# lunepack-update.json: changing any of them strands existing installs.

app_id = "dev.izzat.whipspot"

[root]
version = 1
threshold = 1
keys = [
    # Made by the first bootstrap, 2026-11-26; key changes go through `lunepack publish keys` (the owner's command).
    "6044f290a681ad4f22f3a9b18b2efde7881f4444d42c805de8330a985165e87e",
]

# Signs manifests and feeds. The root key stays offline with the owner and signs only key changes
# (`lunepack publish keys`).
[signers.release]
env = "LUNEPACK_RELEASE_KEY"

# The default channel; a beta release (tag v<x.y.z>-rc.<N>) is packed with `pack --channel beta`.
# An installed copy follows the channel its setup came from (the app records it, D75).
[update]
feed = "https://updates.izzat.dev/whipspot/"
channel = "stable"

[install]
# The Windows layout; [install.macos] below overrides entry and icon for the macOS targets. The
# icon must be a file of the packed tree: scripts/package-macos.sh puts it in the bundle and
# release.yml copies it into the Windows tree. Made by scripts/make-icons.sh from the SVG masters.
entry = "whipspot.exe"
icon = "whipspot-256.png"
name = "Whipspot"
publisher = "Whipspot"
comment = "A desktop music player"
categories = ["AudioVideo", "Audio", "Player"]

[install.macos]
entry = "Contents/MacOS/Whipspot"
icon = "Contents/Resources/whipspot-256.png"

# macOS code signing: an ad-hoc signature (no Apple developer identity, no notarization) on the
# packed app and on the installer app and .dmg that `setup` makes. Without it the installer app is
# only linker-signed, and a downloaded .dmg reports it as "damaged"; with it Gatekeeper shows its
# ordinary unidentified-developer prompt instead. Signing happens before hashing, so the update
# feed signs the signed files. Developer ID signing and notarization would replace these templates.
[codesign.macos]
sign = ["/usr/bin/codesign", "--force", "--sign", "-", "{path}"]
verify = ["/usr/bin/codesign", "--verify", "--deep", "--strict", "{path}"]

# Inputs of the installers' stamping (not part of any signed document), relative to this file.
[windows]
icon = "../assets/icon/whipspot.ico"

[macos]
icon = "../assets/icon/whipspot.icns"

# `lunepack publish` (fetch, push, refresh, drop): names of environment variables, never values.
# release.yml and refresh.yml map their environment's secrets onto these names; the public
# bucket is what the feed URL above serves, the private one holds the publisher state.
[publish]
prefix = "whipspot"
store = "r2"
account_id_env = "R2_ACCOUNT_ID"
access_key_env = "R2_ACCESS_KEY_ID"
secret_key_env = "R2_SECRET_ACCESS_KEY"
private_access_key_env = "R2_PRIVATE_ACCESS_KEY_ID"
private_secret_key_env = "R2_PRIVATE_SECRET_ACCESS_KEY"
public_bucket = "izzat-updates"
private_bucket = "izzat-updates-publisher"
keep = 10
deltas = 1
feed_days = 90
channels = ["stable", "beta"]
prerelease_channels = ["beta"]             # a version with a pre-release part (-rc.N) goes only here
require_targets = ["macos-universal", "windows-x86_64"]
