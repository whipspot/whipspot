# Whipspot's lunepack configuration: public keys and signer locations only, never a key.
# Read by scripts/publish-update.sh; operator steps in release/README.md.
#
# The app id, the root key and the feed below are compiled into every installed copy's
# lunepack-update.json: changing any of them strands existing installs.

app_id = "dev.izzat.whipspot"

# Where the publisher state file lives while a publish runs. publish-update.sh fetches it from the
# private bucket into release/work/ and saves it back only after a publish succeeded.
state = "work/lunepack-state.json"

[root]
version = 1
threshold = 1
keys = [
    # Replaced by `bash scripts/publish-update.sh bootstrap` with the new root's public key.
    "6044f290a681ad4f22f3a9b18b2efde7881f4444d42c805de8330a985165e87e",
]

# Signs manifests and feeds. The root key signs only at bootstrap, through
# `--sign file:$WHIPSPOT_ROOT_KEY` (a config cannot name a key file by an environment variable).
[signers.release]
env = "LUNEPACK_RELEASE_KEY"

[update]
feed = "https://updates.izzat.dev/whipspot/"
channel = "stable"

[install]
# The Windows layout. A macOS pack uses a copy of this file that publish-update.sh writes beside
# it with entry = "Contents/MacOS/Whipspot" and icon = "Contents/Resources/whipspot-256.png"
# (lunepack.toml has one entry and one icon for every target). The icon must be a file of the packed
# tree: scripts/package-macos.sh puts it in the bundle, `publish-update.sh pack` adds it to a tree
# that lacks it. Made by scripts/make-icons.sh from the SVG masters.
entry = "whipspot.exe"
icon = "whipspot-256.png"
name = "Whipspot"
publisher = "Whipspot"
comment = "A desktop music player"
categories = ["AudioVideo", "Audio", "Player"]

# Inputs of the installers' stamping (not part of any signed document), relative to this file.
[windows]
icon = "../assets/icon/whipspot.ico"

[macos]
icon = "../assets/icon/whipspot.icns"
