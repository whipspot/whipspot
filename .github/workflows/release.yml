# Release pipeline. A version tag builds the app for macOS and Windows, packs each build with
# lunepack, makes the installers (a .dmg and a setup .exe), publishes the update with
# `lunepack publish push` (each feed keeps its 10 newest versions; release/README.md) and
# attaches the installers to a draft GitHub Release. v<x.y.z> (on main) is a stable release,
# listed in the stable and beta feeds; v<x.y.z>-rc.<N> (on main or develop) a beta release,
# listed in the beta feed only and packed for the beta channel (D75). macOS is signed ad-hoc
# only (release/lunepack.toml [codesign.macos]): no Apple Developer ID or notarisation, no
# Windows code signing (see README, Install). The weekly feed refresh and the manual drop of a
# release are in refresh.yml.
#
# No job that holds a secret compiles anything. Four kinds of job:
#   build  (tools-*, build-*): cargo runs here, with every build script and proc macro of the
#          dependency tree; no secret, no environment; they hand over unsigned artifacts only.
#          Each tools-* job also outputs the SHA-256 of the lunepack CLI (cli_sha256) and of the
#          runtime, UI and stub that ship in every pack (bins_sha256).
#   pack   (pack-*): environment `release-pack` (tags v* only); holds LUNEPACK_RELEASE_KEY and no
#          R2 key. It checks its OS's tools against the hashes first, then runs only those
#          prebuilt binaries: `publish fetch` (the previous release for the delta, read from the
#          public feed with no credential), `pack`, `setup`. SOURCE_DATE_EPOCH is set in that one
#          step and nowhere else.
#   push   (push): environment `release-push` (tags v*, the owner approves); the release key and
#          the R2 push token. It checks the CLI hash, then runs `publish push --dry-run` and
#          `publish push` on the release directories the pack jobs made.
#   release: no secret; the draft GitHub Release with the installers.
# A manual run (workflow_dispatch) runs the build jobs and nothing else: packing needs the release
# key, which only a tag push may use.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two tags never publish at once, and refresh.yml shares the group so a refresh never starts while
# a push runs; a manual run gets a group of its own and never blocks a release. A run waiting
# behind another is replaced by a newer waiting one (GitHub keeps one, and it can be a refresh):
# watch for a cancelled release run and re-run it (Re-run all jobs); pushing the tag again sends
# no event.
concurrency:
  group: ${{ github.event_name == 'push' && 'whipspot-publish' || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The release's version and channel, checked against the tag before anything is built or
  # uploaded (the channel standard, D75): v<x.y.z> is a stable release on main, listed in both
  # feeds; v<x.y.z>-rc.<N> a beta release on main or develop, listed in the beta feed only. The
  # version of crates/whipspot-app is the base <x.y.z> in both cases. A manual run builds the
  # Cargo version as stable.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the version and match it to the tag and its branch
        id: v
        shell: bash
        run: |
          set -euo pipefail
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/whipspot-app/Cargo.toml | head -1)
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "crates/whipspot-app/Cargo.toml has no <x.y.z> version" >&2; exit 1; }
          version=$base channel=stable
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]] || { echo "the tag is not v<x.y.z> or v<x.y.z>-rc.<N>" >&2; exit 1; }
            [ "${BASH_REMATCH[1]}" = "$base" ] || { echo "the tag is not v$base or v$base-rc.<N> (crates/whipspot-app/Cargo.toml)" >&2; exit 1; }
            version=${GITHUB_REF_NAME#v}
            on() { git rev-parse -q --verify "refs/remotes/origin/$1" >/dev/null && git merge-base --is-ancestor HEAD "origin/$1"; }
            if [ -n "${BASH_REMATCH[2]}" ]; then
              channel=beta
              on main || on develop || { echo "a beta tag must be on main or develop" >&2; exit 1; }
            else
              on main || { echo "a stable tag must be on main" >&2; exit 1; }
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  # lunepack's CLI, runtime and UI, built from the commit Cargo.lock pins (no secrets here).
  # No build cache here: these binaries later run with the release key (pack, push) and ship in
  # every pack, and ci.yml's caches are written by jobs that compile the whole dependency tree, so a
  # restored cache is not trusted. Always a clean target dir.
  # `lunepack prebuilt fetch` refuses a CLI built from source, so the runtime and UI are built here
  # too and held to the bins_sha256 below instead of lunepack's pins.
  # The hashes: `h FILE` is the first field of shasum -a 256 (sha256sum on Linux and Windows);
  # cli_sha256 is h of the CLI; bins_sha256 is h of one line "<h of the file>  <file name>" per
  # runtime, UI (and stub) file, names sorted with LC_ALL=C sort. Every key job recomputes both
  # with the same code and refuses to run a tool on a mismatch or an empty output, or when the
  # downloaded tools directory holds anything but the expected files (an artifact re-uploaded under
  # the same name could add a DLL beside the CLI). The printf line keeps Git bash's `*name` binary
  # marker out of the listing.
  tools-macos:
    runs-on: macos-latest
    outputs:
      cli_sha256: ${{ steps.hash.outputs.cli_sha256 }}
      bins_sha256: ${{ steps.hash.outputs.bins_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the lunepack commit from Cargo.lock
        id: pin
        shell: bash
        run: |
          revs=$(grep -E '^source = "git\+https://github\.com/lune-rs/lunepack\?rev=[0-9a-f]{40}#[0-9a-f]{40}"$' Cargo.lock | sort -u)
          [ "$(grep -c . <<<"$revs")" = 1 ] || { echo "Cargo.lock does not pin one lunepack commit" >&2; exit 1; }
          rev=$(sed -E 's/^.*\?rev=([0-9a-f]{40})#([0-9a-f]{40})"$/\1 \2/' <<<"$revs")
          [ "${rev% *}" = "${rev#* }" ] || { echo "the lunepack rev and its locked commit differ" >&2; exit 1; }
          echo "rev=${rev% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lune-rs/lunepack
          ref: ${{ steps.pin.outputs.rev }}
          path: lunepack-src
          persist-credentials: false
      - name: Build the CLI, runtime and UI (universal)
        shell: bash
        env:
          PIN: ${{ steps.pin.outputs.rev }}
        run: |
          set -euo pipefail
          [ "$(git -C lunepack-src rev-parse HEAD)" = "$PIN" ] || { echo "the lunepack checkout is not the pinned commit" >&2; exit 1; }
          out="$GITHUB_WORKSPACE/dist/lunepack-tools"
          mkdir -p "$out"
          cd lunepack-src
          cargo fetch --locked
          cargo build --locked --release -p lunepack-cli --config profile.release.strip=true
          cp target/release/lunepack "$out/lunepack"
          bash scripts/build-runtime.sh macos-universal --package lunepack-runtime --out "$out/lunepack-runtime"
          bash scripts/build-runtime.sh macos-universal --package lunepack-ui --out "$out/lunepack-ui"
          ls -l "$out"
      - name: Hash the tools
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          h() { shasum -a 256 "$1" | cut -d' ' -f1; }
          dir=dist/lunepack-tools
          cli=$(h "$dir/lunepack")
          bins=$(for f in $(printf '%s\n' lunepack-runtime lunepack-ui | LC_ALL=C sort); do printf '%s  %s\n' "$(h "$dir/$f")" "$f"; done | h -)
          [[ "$cli" =~ ^[0-9a-f]{64}$ && "$bins" =~ ^[0-9a-f]{64}$ ]] || { echo "no usable tool hash" >&2; exit 1; }
          echo "cli_sha256=$cli" >> "$GITHUB_OUTPUT"
          echo "bins_sha256=$bins" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-macos
          path: dist/lunepack-tools
          if-no-files-found: error
          retention-days: 7

  tools-windows:
    runs-on: windows-latest
    outputs:
      cli_sha256: ${{ steps.hash.outputs.cli_sha256 }}
      bins_sha256: ${{ steps.hash.outputs.bins_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the lunepack commit from Cargo.lock
        id: pin
        shell: bash
        run: |
          revs=$(grep -E '^source = "git\+https://github\.com/lune-rs/lunepack\?rev=[0-9a-f]{40}#[0-9a-f]{40}"$' Cargo.lock | sort -u)
          [ "$(grep -c . <<<"$revs")" = 1 ] || { echo "Cargo.lock does not pin one lunepack commit" >&2; exit 1; }
          rev=$(sed -E 's/^.*\?rev=([0-9a-f]{40})#([0-9a-f]{40})"$/\1 \2/' <<<"$revs")
          [ "${rev% *}" = "${rev#* }" ] || { echo "the lunepack rev and its locked commit differ" >&2; exit 1; }
          echo "rev=${rev% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lune-rs/lunepack
          ref: ${{ steps.pin.outputs.rev }}
          path: lunepack-src
          persist-credentials: false
      - name: Build the CLI
        shell: bash
        env:
          PIN: ${{ steps.pin.outputs.rev }}
        run: |
          set -euo pipefail
          [ "$(git -C lunepack-src rev-parse HEAD)" = "$PIN" ] || { echo "the lunepack checkout is not the pinned commit" >&2; exit 1; }
          cd lunepack-src
          cargo fetch --locked
          cargo build --locked --release -p lunepack-cli --config profile.release.strip=true
      - name: Build the runtime, UI and stub
        shell: pwsh
        working-directory: lunepack-src
        run: ./scripts/release/build.ps1 -OutDir ../dist/lunepack-bin
      - name: Gather the tools
        shell: bash
        run: |
          set -euo pipefail
          out=dist/lunepack-tools
          mkdir -p "$out"
          cp lunepack-src/target/release/lunepack.exe "$out/lunepack.exe"
          for kind in runtime ui stub; do
            files=(dist/lunepack-bin/lunepack-"$kind"-[0-9]*-windows-x86_64.exe)
            [ "${#files[@]}" = 1 ] && [ -f "${files[0]}" ] || { echo "not exactly one lunepack-$kind in the build output" >&2; exit 1; }
            cp "${files[0]}" "$out/lunepack-$kind.exe"
          done
          ls -l "$out"
      - name: Hash the tools
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          h() { sha256sum "$1" | cut -d' ' -f1; }
          dir=dist/lunepack-tools
          cli=$(h "$dir/lunepack.exe")
          bins=$(for f in $(printf '%s\n' lunepack-runtime.exe lunepack-ui.exe lunepack-stub.exe | LC_ALL=C sort); do printf '%s  %s\n' "$(h "$dir/$f")" "$f"; done | h -)
          [[ "$cli" =~ ^[0-9a-f]{64}$ && "$bins" =~ ^[0-9a-f]{64}$ ]] || { echo "no usable tool hash" >&2; exit 1; }
          echo "cli_sha256=$cli" >> "$GITHUB_OUTPUT"
          echo "bins_sha256=$bins" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-windows
          path: dist/lunepack-tools
          if-no-files-found: error
          retention-days: 7

  # Builds the app. cargo runs here, so there is no secret and no environment in this job. No build
  # cache either: ci.yml writes main's caches from jobs that also compile dev-dependencies, test
  # binaries and CI tools the release never builds, and a cache restored here could carry code from
  # them into the signed app. A clean build every time. The bundle goes out as a tar (an artifact
  # zip drops the executable bits); pack-macos checks it.
  build-macos:
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build dist/Whipspot.app (universal, unsealed for lunepack)
        run: bash scripts/package-macos.sh --arch universal --unsealed
      - name: Tar the bundle
        shell: bash
        run: |
          set -euo pipefail
          [ -d dist/Whipspot.app ] || { echo "no dist/Whipspot.app" >&2; exit 1; }
          COPYFILE_DISABLE=1 tar -C dist -cf dist/Whipspot-app.tar Whipspot.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-macos
          path: dist/Whipspot-app.tar
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: bash
        run: cargo build --release --locked -p whipspot-app
      - name: Lay out the install tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/input
          cp target/release/whipspot-app.exe dist/input/whipspot.exe
          cp LICENSE dist/input/LICENSE.txt
          cp assets/icon/whipspot-256.png dist/input/whipspot-256.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-windows
          path: dist/input
          if-no-files-found: error
          retention-days: 7

  # Packs the macOS build and makes the .dmg. Compiles nothing: the lunepack CLI, runtime and UI
  # built by tools-macos run here, after their hashes are checked. The release key is in the one
  # step that fetches, packs and sets up (with SOURCE_DATE_EPOCH, which no other step sets); there
  # is no R2 key: the previous release is read from the public feed over https.
  pack-macos:
    if: github.event_name == 'push'
    needs: [version, tools-macos, build-macos]
    runs-on: macos-latest
    environment: release-pack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools-macos
          path: dist/lunepack-tools
      - name: Check the tools against tools-macos
        shell: bash
        env:
          WANT_CLI: ${{ needs.tools-macos.outputs.cli_sha256 }}
          WANT_BINS: ${{ needs.tools-macos.outputs.bins_sha256 }}
        run: |
          set -euo pipefail
          # Exactly the expected files and nothing else (no extra file, directory or symlink): an
          # artifact a build job re-uploaded under this name could carry a DLL beside the CLI.
          dir=dist/lunepack-tools
          want_files=$(printf '%s\n' lunepack lunepack-runtime lunepack-ui | LC_ALL=C sort)
          not_files=$(find "$dir" -mindepth 1 ! -type f -print)
          have_files=$(find "$dir" -mindepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          if [ -n "$not_files" ] || [ "$have_files" != "$want_files" ]; then
            echo "the tools directory does not hold exactly the expected files" >&2
            exit 1
          fi
          h() { shasum -a 256 "$1" | cut -d' ' -f1; }
          cli=$(h "$dir/lunepack")
          bins=$(for f in $(printf '%s\n' lunepack-runtime lunepack-ui | LC_ALL=C sort); do printf '%s  %s\n' "$(h "$dir/$f")" "$f"; done | h -)
          if [ -z "$WANT_CLI" ] || [ -z "$WANT_BINS" ] || [ "$cli" != "$WANT_CLI" ] || [ "$bins" != "$WANT_BINS" ]; then
            echo "the tools are not the ones tools-macos built" >&2
            exit 1
          fi
          chmod +x "$dir/lunepack" "$dir/lunepack-runtime" "$dir/lunepack-ui"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-macos
          path: dist/app-tar
      - name: Unpack the bundle (only Whipspot.app, no path leaves it)
        shell: bash
        run: |
          set -euo pipefail
          tar=dist/app-tar/Whipspot-app.tar
          [ -f "$tar" ] || { echo "no app tar" >&2; exit 1; }
          names=$(tar -tf "$tar")
          [ -n "$names" ] || { echo "the app tar is empty" >&2; exit 1; }
          outside=$(grep -Ev '^Whipspot\.app(/|$)' <<<"$names" || true)
          [ -z "$outside" ] || { echo "the app tar holds a path outside Whipspot.app" >&2; exit 1; }
          if grep -Eq '(^|/)\.\.(/|$)' <<<"$names"; then echo "the app tar holds a .. path" >&2; exit 1; fi
          mkdir -p dist
          tar -xf "$tar" -C dist
          [ -x dist/Whipspot.app/Contents/MacOS/Whipspot ] || { echo "the bundle has no executable" >&2; exit 1; }
          [ -f dist/Whipspot.app/Contents/Resources/whipspot-256.png ] || { echo "the bundle has no install icon" >&2; exit 1; }
      - name: Fetch, pack and make the installer (.dmg)
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          LUNEPACK_RELEASE_KEY: ${{ secrets.LUNEPACK_RELEASE_KEY }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          tools=dist/lunepack-tools
          "$tools/lunepack" publish fetch --config release/lunepack.toml --release-dir release-dir --version "$VERSION"
          "$tools/lunepack" pack --config release/lunepack.toml --input dist/Whipspot.app --version "$VERSION" \
            --target macos-universal --release-dir release-dir --sign release --deltas 1 --channel "$CHANNEL" \
            --runtime "$tools/lunepack-runtime" --ui "$tools/lunepack-ui"
          "$tools/lunepack" setup release-dir --config release/lunepack.toml --version "$VERSION" \
            --target macos-universal --out "dist/whipspot-$VERSION-macos-universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: release-dir
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  pack-windows:
    if: github.event_name == 'push'
    needs: [version, tools-windows, build-windows]
    runs-on: windows-latest
    environment: release-pack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools-windows
          path: dist/lunepack-tools
      - name: Check the tools against tools-windows
        shell: bash
        env:
          WANT_CLI: ${{ needs.tools-windows.outputs.cli_sha256 }}
          WANT_BINS: ${{ needs.tools-windows.outputs.bins_sha256 }}
        run: |
          set -euo pipefail
          # Exactly the expected files and nothing else (no extra file, directory or symlink): an
          # artifact a build job re-uploaded under this name could carry a DLL beside the CLI.
          dir=dist/lunepack-tools
          want_files=$(printf '%s\n' lunepack.exe lunepack-runtime.exe lunepack-stub.exe lunepack-ui.exe | LC_ALL=C sort)
          not_files=$(find "$dir" -mindepth 1 ! -type f -print)
          have_files=$(find "$dir" -mindepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          if [ -n "$not_files" ] || [ "$have_files" != "$want_files" ]; then
            echo "the tools directory does not hold exactly the expected files" >&2
            exit 1
          fi
          h() { sha256sum "$1" | cut -d' ' -f1; }
          cli=$(h "$dir/lunepack.exe")
          bins=$(for f in $(printf '%s\n' lunepack-runtime.exe lunepack-ui.exe lunepack-stub.exe | LC_ALL=C sort); do printf '%s  %s\n' "$(h "$dir/$f")" "$f"; done | h -)
          if [ -z "$WANT_CLI" ] || [ -z "$WANT_BINS" ] || [ "$cli" != "$WANT_CLI" ] || [ "$bins" != "$WANT_BINS" ]; then
            echo "the tools are not the ones tools-windows built" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-windows
          path: dist/input
      - name: Check the install tree
        shell: bash
        run: |
          set -euo pipefail
          for f in whipspot.exe LICENSE.txt whipspot-256.png; do
            [ -f "dist/input/$f" ] || { echo "the install tree lacks $f" >&2; exit 1; }
          done
          [ "$(find dist/input -mindepth 1 | wc -l | tr -d ' ')" = 3 ] || { echo "the install tree holds more than whipspot.exe, LICENSE.txt and whipspot-256.png" >&2; exit 1; }
      - name: Fetch, pack and make the installer (setup .exe)
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          LUNEPACK_RELEASE_KEY: ${{ secrets.LUNEPACK_RELEASE_KEY }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          tools=dist/lunepack-tools
          "$tools/lunepack.exe" publish fetch --config release/lunepack.toml --release-dir release-dir --version "$VERSION"
          "$tools/lunepack.exe" pack --config release/lunepack.toml --input dist/input --version "$VERSION" \
            --target windows-x86_64 --release-dir release-dir --sign release --deltas 1 --channel "$CHANNEL" \
            --runtime "$tools/lunepack-runtime.exe" --ui "$tools/lunepack-ui.exe" --stub "$tools/lunepack-stub.exe"
          "$tools/lunepack.exe" setup release-dir --config release/lunepack.toml --version "$VERSION" \
            --target windows-x86_64 --out "dist/whipspot-$VERSION-windows-x86_64-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x86_64
          path: release-dir
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  # Adds the version to its feeds (stable and beta, or beta only for an -rc.<N>), drops all but the
  # 10 newest of each, uploads, deletes the dropped folders and saves the publisher state (all
  # inside `lunepack publish push`, after a dry run).
  # The only job with the R2 write token, and it waits for the owner's approval (environment
  # release-push). It compiles nothing: the CLI is the macOS one from tools-macos (this job runs on
  # a Mac runner, so no Linux CLI is built), run only after its hash is checked. No
  # SOURCE_DATE_EPOCH: push signs the feeds at the real time. The one R2 token serves both
  # buckets, so it is mapped to both of [publish]'s pairs.
  push:
    if: github.event_name == 'push'
    needs: [version, tools-macos, pack-macos, pack-windows]
    runs-on: macos-latest
    environment: release-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools-macos
          path: dist/lunepack-tools
      - name: Check the tools against tools-macos (the CLI runs here with the release key)
        shell: bash
        env:
          WANT_CLI: ${{ needs.tools-macos.outputs.cli_sha256 }}
          WANT_BINS: ${{ needs.tools-macos.outputs.bins_sha256 }}
        run: |
          set -euo pipefail
          # Exactly the expected files and nothing else (no extra file, directory or symlink): an
          # artifact a build job re-uploaded under this name could carry a DLL beside the CLI.
          dir=dist/lunepack-tools
          want_files=$(printf '%s\n' lunepack lunepack-runtime lunepack-ui | LC_ALL=C sort)
          not_files=$(find "$dir" -mindepth 1 ! -type f -print)
          have_files=$(find "$dir" -mindepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          if [ -n "$not_files" ] || [ "$have_files" != "$want_files" ]; then
            echo "the tools directory does not hold exactly the expected files" >&2
            exit 1
          fi
          h() { shasum -a 256 "$1" | cut -d' ' -f1; }
          cli=$(h "$dir/lunepack")
          bins=$(for f in $(printf '%s\n' lunepack-runtime lunepack-ui | LC_ALL=C sort); do printf '%s  %s\n' "$(h "$dir/$f")" "$f"; done | h -)
          if [ -z "$WANT_CLI" ] || [ -z "$WANT_BINS" ] || [ "$cli" != "$WANT_CLI" ] || [ "$bins" != "$WANT_BINS" ]; then
            echo "the tools are not the ones tools-macos built" >&2
            exit 1
          fi
          chmod +x "$dir/lunepack" "$dir/lunepack-runtime" "$dir/lunepack-ui"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-universal
          path: release-macos-universal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-x86_64
          path: release-windows-x86_64
      - name: Push the release
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LUNEPACK_RELEASE_KEY: ${{ secrets.LUNEPACK_RELEASE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          lp=dist/lunepack-tools/lunepack
          "$lp" publish push --config release/lunepack.toml \
            --release-dir release-macos-universal --release-dir release-windows-x86_64 \
            --version "$VERSION" --sign release --dry-run
          "$lp" publish push --config release/lunepack.toml \
            --release-dir release-macos-universal --release-dir release-windows-x86_64 \
            --version "$VERSION" --sign release

  # No secrets here. A separate job so a failed upload to GitHub can be re-run alone: `push`
  # refuses a version that is already in the feed.
  release:
    if: github.event_name == 'push'
    needs: [version, push, pack-macos, pack-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      # A beta release (an -rc.<N> tag) is a GitHub prerelease; a stable one is not.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          pre=()
          [ "$CHANNEL" = beta ] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*-setup.exe \
            --repo "$GITHUB_REPOSITORY" --draft "${pre[@]}" --generate-notes \
            --title "Whipspot $GITHUB_REF_NAME"
