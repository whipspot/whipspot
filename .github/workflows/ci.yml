# CI for Whipspot: format, lints, tests and the crate-boundary checks on Windows and macOS, and a
# coverage summary. Uses no repository secrets.
# The toolchain comes from rust-toolchain.toml (rustup installs it on the first cargo call).
# Not run here: the demo's GUI smoke and screenshot checks (they need a desktop session and a GPU).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        shell: bash
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: cargo test --workspace
      - name: Crate boundaries
        shell: bash
        run: bash scripts/check-boundaries.sh
      - name: Crate boundaries self-test
        shell: bash
        run: bash scripts/check-boundaries-selftest.sh
      # No cross clippy for aarch64-apple-darwin here: ring (through lunepack) does not cross-compile
      # to macOS from Windows; gate-macos runs clippy natively on an aarch64 runner.

  # Compiles and runs the fake-based tests only; no GUI is run.
  gate-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Crate boundaries
        run: bash scripts/check-boundaries.sh

  # A summary with no threshold: it shows where the tests do not reach, it does not gate a merge.
  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov
      - name: Add llvm-tools to the pinned toolchain
        shell: bash
        run: rustup component add llvm-tools-preview
      - name: Coverage summary
        shell: bash
        run: bash scripts/coverage.sh | tee coverage-summary.txt
      - name: Upload the summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 7
