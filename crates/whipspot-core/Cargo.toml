[package]
name = "whipspot-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
realfft = "3"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
triple_buffer = "9"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[lints]
workspace = true
