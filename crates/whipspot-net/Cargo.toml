[package]
name = "whipspot-net"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
whipspot-core = { path = "../whipspot-core" }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt", "time", "sync"] }
serde_json = "1"
sha2 = "0.10"
png = "0.18"
zune-jpeg = "0.5"
zune-core = "0.5"

[dev-dependencies]
whipspot-testkit = { path = "../whipspot-testkit" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tempfile = "3"
jpeg-encoder = "0.6"

[lints]
workspace = true
