[package]
name = "whipspot-skin-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
whipspot-core = { path = "../whipspot-core" }
miniz_oxide = "0.8"
# Image decoders, one feature each; the versions are the ones whipspot-net uses.
png = { version = "0.18", optional = true }
zune-jpeg = { version = "0.5", optional = true }
zune-core = { version = "0.5", optional = true }

[features]
# Builders for synthetic bitmaps and archives (tests and the demo skins). Not in the product build.
synth = []
png = ["dep:png"]
jpeg = ["dep:zune-jpeg", "dep:zune-core"]

[dev-dependencies]
# Already in the lock file (whipspot-net's dev-dependency); encodes the JPEG test input.
jpeg-encoder = "0.6"

[lints]
workspace = true
