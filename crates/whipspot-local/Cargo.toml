[package]
name = "whipspot-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
whipspot-core = { path = "../whipspot-core" }
# Tags and durations (D2). Vendored and patched (vendor/lofty/WHIPSPOT-PATCH.md, MD167): compressed
# ID3v2 frames are skipped, never inflated. Its default feature stays on: 0.25.4 does not compile
# without it.
lofty = "=0.25.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The decoder (D2): its own copy, librespot keeps 0.5.5.
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "pcm", "wav", "aiff", "alac", "aac", "isomp4", "mp3", "vorbis", "ogg", "caf"] }
# Art (D9): the same decoders and versions as whipspot-net.
png = "0.18"
zune-jpeg = "0.5"
zune-core = "0.5"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
whipspot-testkit = { path = "../whipspot-testkit" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
jpeg-encoder = "0.6"

[lints]
workspace = true
